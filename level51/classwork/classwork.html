<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    p {
        font-size: 100px;
        color: green;
        text-decoration: underline dotted red;
    }

    a{
        color: blue;
        text-decoration: none;
    }

    a:hover{
        text-decoration: underline;
    }

    button{
        background-color: black;
        color: white;
        border: 1px dashed black;
        width: 200px;
        height: 50px;
        font-size: xx-large;
        transform: 0.3s;
    }

    button:hover{
        color: black;
        background-color: white;
        cursor: pointer;
    }

    button:active{
        background-color: orange;
    }
</style>

<body>
    <p>Hello world</p>
    <a href="">Hello worldV2 --</a>
    <a href="">hello worldV3</a>
    <button>hello World</button>
</body>

</html>
